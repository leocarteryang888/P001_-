<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>过滤器选型</title><link rel="stylesheet" href="css/filter-selector.css"><script src="data/filter-database.js" defer></script><script src="js/filter-selector.js" defer></script></head><body><header class="header">过滤器选型</header><main class="container">
<section class="panel input-panel" aria-labelledby="inputTitle"><h2 id="inputTitle">选型参数</h2><div class="mode-toggle" aria-label="过滤器安装形式"><button type="button" class="active" data-mode="pull" aria-pressed="true">抽拉过滤</button><button type="button" data-mode="frame" aria-pressed="false">框架过滤</button></div><div class="form-group"><label for="filterType">过滤器类型</label><select id="filterType"></select></div><div class="form-group"><label for="widthModule">箱体宽度模数</label><select id="widthModule"></select></div><div class="form-group"><label for="heightModule">箱体高度模数</label><select id="heightModule"></select></div><div class="note">本模块只根据过滤形式、过滤器类型及箱体宽高模数，计算标准过滤器数量和规格。</div></section>
<section class="panel" aria-labelledby="resultTitle"><h2 id="resultTitle">选型结果</h2><div id="error" class="error" hidden></div><div id="resultContent"><div class="summary"><div class="summary-card"><div class="summary-label">过滤器类型</div><div class="summary-value" id="selectedType">--</div></div><div class="summary-card"><div class="summary-label">过滤器总数</div><div class="summary-value" id="totalCount">--</div></div><div class="summary-card"><div class="summary-label">规格种类</div><div class="summary-value" id="kindCount">--</div></div></div><div class="section"><h3>宽度方向排布 <span class="badge" id="widthBadge"></span></h3><div class="arrangement" id="widthArrangement"></div></div><div class="section"><h3>高度方向排布 <span class="badge" id="heightBadge"></span></h3><div class="arrangement" id="heightArrangement"></div></div><div class="section"><h3>过滤器排布</h3><div class="visual-grid" id="filterGrid"></div></div><div class="section"><h3>规格与数量</h3><div class="spec-list" id="specList"></div></div></div></section>
</main></body></html>
