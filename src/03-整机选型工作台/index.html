<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P001 整机工作台入口</title>
<style>body{font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif;max-width:720px;margin:12vh auto;padding:24px;color:#23414a;background:#f2f7f7}main{padding:28px;background:white;border:1px solid #c8d9dd;border-radius:12px}button,a{display:inline-block;margin:8px 8px 0 0;padding:10px 16px;border:0;border-radius:6px;background:#087f8c;color:white;text-decoration:none;cursor:pointer;font:inherit}.secondary{background:#55727b}#status{font-size:14px;color:#57717a}</style>
<main><h1>兼容迁移入口（非最终软件界面）</h1><p>整机项目管理与机组编辑已统一到 Three.js 工作台。正式项目存档保持只读；可在统一工作台中选择正式机组并导入可编辑副本。</p><p id="status">正在检查 file:// 来源的旧 V2 存档……</p><button id="export" class="secondary" type="button">导出此 file:// 浏览器的 V2 存档</button><a href="http://127.0.0.1:8765/工业工作台_ThreeJS原型.html">打开当前唯一最终版工作台</a><p>如果本地服务未运行，请先启动 tools/打开整机选型工作台.bat。导出的 JSON 可在统一工作台的“从 V2 JSON 导入副本”操作中导入。</p></main>
<script>
const status=document.getElementById('status');let hasData=false;try{hasData=!!(localStorage.getItem('p001-ahu-project-index-v2')||localStorage.getItem('p001-ahu-project-v2'));status.textContent=hasData?'检测到此 file:// 来源有正式 V2 存档。请先导出 JSON，再进入统一工作台。':'此来源未检测到可读取的 V2 存档；可以直接进入统一工作台。'};}catch{status.textContent='浏览器禁止读取 file:// localStorage。请在原正式工作台可访问的浏览器配置中导出项目 JSON，再从统一工作台导入。'}
document.getElementById('export').addEventListener('click',()=>{try{const payload={projectIndex:JSON.parse(localStorage.getItem('p001-ahu-project-index-v2')||'[]'),currentProject:JSON.parse(localStorage.getItem('p001-ahu-project-v2')||'null')};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='P001-V2-只读存档导出.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='已导出 JSON。文件可在统一工作台中导入为副本，原 V2 存档未修改。';}catch(error){status.textContent='导出失败：'+error.message;}});
</script></html>
